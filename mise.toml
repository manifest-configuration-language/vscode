[tools]
node = "24.22.0"
pnpm = "12.14.0"
jactionlint = "2.2.0"

[tools."github:manifest-configuration-language/mcl"]
version = "0.3.10"
rename_exe = "mcl"

[tools."github:manifest-configuration-language/mcl".platforms]
linux-x64 = { asset_pattern = "mcl_{{ version }}_linux_amd64.tar.gz" }
linux-arm64 = { asset_pattern = "mcl_{{ version }}_linux_arm64.tar.gz" }
macos-x64 = { asset_pattern = "mcl_{{ version }}_darwin_amd64.tar.gz" }
macos-arm64 = { asset_pattern = "mcl_{{ version }}_darwin_arm64.tar.gz" }
windows-x64 = { asset_pattern = "mcl_{{ version }}_windows_amd64.zip", rename_exe = "mcl.exe" }
windows-arm64 = { asset_pattern = "mcl_{{ version }}_windows_arm64.zip", rename_exe = "mcl.exe" }

[tasks."actions:lint"]
description = "Lint GitHub Actions workflows"
run = "jactionlint .github/workflows/*.yml"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.compile]
depends = ["install"]
run = "pnpm run compile"

[tasks.test]
depends = ["install"]
run = "pnpm run test"

[tasks.lint]
depends = ["install"]
run = "pnpm run lint"

[tasks."format:check"]
depends = ["install"]
run = "pnpm run format:check"

[tasks.package]
depends = ["install"]
run = "pnpm run package"
