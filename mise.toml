[tools]
node = "24.22.0"
pnpm = "12.14.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.compile]
depends = ["install"]
run = "pnpm run compile"

[tasks.test]
depends = ["install"]
run = "pnpm run test"

[tasks.lint]
depends = ["install"]
run = "pnpm run lint"

[tasks."format:check"]
depends = ["install"]
run = "pnpm run format:check"

[tasks.package]
depends = ["install"]
run = "pnpm run package"
