name: Release VS Code extension
run-name: Release ${{ inputs.bump }} version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment applied to package.json
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: vscode-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      commit_sha: ${{ steps.version-commit.outputs.commit_sha }}
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release target
        id: target
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "Dispatch this workflow from the default branch." >&2
            exit 1
          fi

          npm version "$RELEASE_BUMP" --no-git-tag-version --ignore-scripts
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          {
            echo "version=${RELEASE_VERSION}"
            echo "tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit package version
        id: version-commit
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release VS Code extension v${RELEASE_VERSION}"
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      commit_sha: ${{ needs.prepare-release.outputs.commit_sha }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Run extension checks
        run: |
          mise run test
          mise run lint
          mise run format:check

      - name: Build VSIX
        run: mise run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-vscode-${{ needs.prepare-release.outputs.version }}
          path: dist/*.vsix
          if-no-files-found: error

  attest:
    needs: package
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      - name: Attest VSIX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.vsix

  publish-marketplace:
    needs: [package, attest]
    environment: marketplace
    if: ${{ always() && needs.package.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Install dependencies
        run: mise run install

      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      # TODO: Replace VSCE_PAT with Marketplace trusted publishing via --oidc when the Marketplace backend supports it.
      - name: Publish to Visual Studio Marketplace
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          publish_flags=(--skip-duplicate)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            publish_flags+=(--pre-release)
          fi
          pnpm exec vsce publish \
            --packagePath "dist/mcl-${RELEASE_VERSION}.vsix" \
            "${publish_flags[@]}"

  release:
    needs: [package, attest, publish-marketplace]
    if: >-
      always() &&
      needs.package.result == 'success' &&
      needs.publish-marketplace.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.package.outputs.commit_sha }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT_SHA" \
            --title "MCL VS Code $RELEASE_VERSION" \
            --generate-notes \
            "${release_flags[@]}"
