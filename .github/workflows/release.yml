name: Release VS Code extension
run-name: Release ${{ inputs.version || 'automatic version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release. Empty uses package.json for the first release, then the next patch.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      commit_sha: ${{ steps.version-commit.outputs.commit_sha }}
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release target
        id: target
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "Dispatch this workflow from the default branch." >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const parseVersion = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(value);
            if (!match) throw new Error(`Invalid release version: ${value}`);
            return [Number(match[1]), Number(match[2]), Number(match[3]), match[4] ?? null];
          };
          const compareVersions = (left, right) => {
            const a = parseVersion(left);
            const b = parseVersion(right);
            for (let index = 0; index < 3; index++) {
              if (a[index] !== b[index]) return a[index] - b[index];
            }
            if (a[3] === b[3]) return 0;
            if (a[3] === null) return 1;
            if (b[3] === null) return -1;
            return a[3].localeCompare(b[3], undefined, { numeric: true });
          };

          const tags = execFileSync("git", ["tag", "--list", "v*", "--sort=-version:refname"], {
            encoding: "utf8",
          }).trim().split("\n").filter(Boolean);
          const latestStableTag = tags.find((tag) => /^v\d+\.\d+\.\d+$/.test(tag));
          const latestStableVersion = latestStableTag?.slice(1);
          const requestedVersion = process.env.RELEASE_VERSION_INPUT;
          let version = requestedVersion;

          if (!version) {
            if (!latestStableVersion) {
              version = manifest.version;
            } else if (compareVersions(manifest.version, latestStableVersion) > 0) {
              version = manifest.version;
            } else {
              const [major, minor, patch] = parseVersion(latestStableVersion);
              version = `${major}.${minor}.${patch + 1}`;
            }
          }

          parseVersion(version);
          if (latestStableVersion && compareVersions(version, latestStableVersion) <= 0) {
            throw new Error(`Release version ${version} must be greater than ${latestStableVersion}.`);
          }
          if (compareVersions(version, manifest.version) < 0) {
            throw new Error(`Release version ${version} must not be lower than package.json version ${manifest.version}.`);
          }
          if (tags.includes(`v${version}`)) {
            throw new Error(`Release tag v${version} already exists.`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

      - name: Update package version
        id: version-commit
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          manifest.version = process.env.RELEASE_VERSION;
          writeFileSync("package.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release VS Code extension v${RELEASE_VERSION}"
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      commit_sha: ${{ needs.prepare-release.outputs.commit_sha }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Run extension checks
        run: |
          mise run test
          mise run lint
          mise run format:check

      - name: Build VSIX
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mise run compile
          node scripts/prepare-vsix.mjs
          mkdir -p dist
          pnpm exec vsce package --no-dependencies --out "dist/mcl-${RELEASE_VERSION}.vsix"
          node scripts/verify-vsix.mjs "dist/mcl-${RELEASE_VERSION}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-vscode-${{ needs.prepare-release.outputs.version }}
          path: dist/*.vsix
          if-no-files-found: error

  attest:
    needs: package
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      - name: Attest VSIX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.vsix

  publish-marketplace:
    needs: [package, attest]
    environment: marketplace
    if: ${{ always() && needs.package.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Install dependencies
        run: mise run install

      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      # TODO: Replace VSCE_PAT with Marketplace trusted publishing via --oidc when the Marketplace backend supports it.
      - name: Publish to Visual Studio Marketplace
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          publish_flags=(--skip-duplicate)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            publish_flags+=(--pre-release)
          fi
          pnpm exec vsce publish \
            --packagePath "dist/mcl-${RELEASE_VERSION}.vsix" \
            "${publish_flags[@]}"

  release:
    needs: [package, attest, publish-marketplace]
    if: >-
      always() &&
      needs.package.result == 'success' &&
      needs.publish-marketplace.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.package.outputs.commit_sha }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT_SHA" \
            --title "MCL VS Code $RELEASE_VERSION" \
            --generate-notes \
            "${release_flags[@]}"
