name: Package VS Code extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json. Empty uses the current manifest version.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: vscode-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Resolve release version
        id: target
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
              echo "Dispatch this workflow from the default branch." >&2
              exit 1
            fi
            release_version="${RELEASE_VERSION_INPUT:-$package_version}"
          fi
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          if [ "$release_version" != "$package_version" ]; then
            echo "Release version $release_version must match package.json version $package_version." >&2
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Run extension checks
        run: |
          mise run test
          mise run lint
          mise run format:check

      - name: Build VSIX
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          mise run compile
          node scripts/prepare-vsix.mjs
          mkdir -p dist
          pnpm exec vsce package --no-dependencies --out "dist/mcl-${RELEASE_VERSION}.vsix"
          node scripts/verify-vsix.mjs "dist/mcl-${RELEASE_VERSION}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcl-vscode-${{ steps.target.outputs.version }}
          path: dist/*.vsix
          if-no-files-found: error

  attest:
    needs: package
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      - name: Attest VSIX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.vsix

  publish-marketplace:
    needs: [package, attest]
    environment: marketplace
    if: ${{ always() && needs.package.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      - name: Install dependencies
        run: mise run install

      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      - name: Sign in to Microsoft Entra
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          publish_flags=(--skip-duplicate)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            publish_flags+=(--pre-release)
          fi
          pnpm exec vsce publish \
            --azure-credential \
            --packagePath "dist/mcl-${RELEASE_VERSION}.vsix" \
            "${publish_flags[@]}"

  release:
    needs: [package, attest, publish-marketplace]
    if: >-
      always() &&
      needs.package.result == 'success' &&
      needs.publish-marketplace.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcl-vscode-${{ needs.package.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MCL VS Code $RELEASE_VERSION" \
            --generate-notes \
            "${release_flags[@]}"
