name: VS Code extension

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: true
          cache: true
      - run: mise run install
      - name: Download and verify released MCL CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(node -p "require('./mcl-cli-version.json').tag")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          archive="mcl_${version}_linux_amd64.tar.gz"
          install_dir="$GITHUB_WORKSPACE/.vscode-test/mcl-cli"
          mkdir -p "$install_dir"
          gh release download "$tag" \
            --repo manifest-configuration-language/mcl \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --dir "$install_dir"
          (cd "$install_dir" && sha256sum --ignore-missing --check SHA256SUMS)
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          mv "$install_dir/mcl-linux-amd64" "$install_dir/mcl"
      - parallel:
          - name: Run extension tests
            run: pnpm run test
          - name: Run VS Code language server integration tests
            run: |
              vscode_version="$(node -p "require('./node_modules/@types/vscode/package.json').version")"
              xvfb-run -a pnpm run test:integration --code-version "$vscode_version"
          - name: Lint extension
            run: pnpm run lint
          - name: Check formatting
            run: pnpm run format:check
          - name: Lint GitHub Actions workflows
            run: mise run actions:lint
      - run: pnpm run package
