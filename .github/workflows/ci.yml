name: VS Code extension

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - run: mise run install
      - parallel:
          - name: Run extension tests
            run: pnpm run test
          - name: Run VS Code language server integration tests
            run: |
              vscode_version="$(node -p "require('./node_modules/@types/vscode/package.json').version")"
              xvfb-run -a pnpm run test:integration --code-version "$vscode_version"
          - name: Lint extension
            run: pnpm run lint
          - name: Check formatting
            run: pnpm run format:check
          - name: Lint GitHub Actions workflows
            run: mise run actions:lint
      - run: pnpm run package
